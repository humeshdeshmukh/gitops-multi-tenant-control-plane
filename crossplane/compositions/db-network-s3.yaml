apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: compositedbnetworks3s.platform.devops.local
spec:
  group: platform.devops.local
  names:
    kind: CompositeDBNetworkS3
    plural: compositedbnetworks3s
  claimNames:
    kind: DBNetworkS3
    plural: dbnetworks3s
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              parameters:
                type: object
                properties:
                  storageGB:
                    type: integer
                    default: 20
                  bucketName:
                    type: string
                  region:
                    type: string
                    default: "us-east-1"
                required:
                - storageGB
                - bucketName
            required:
            - parameters
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: compositedbnetworks3s.platform.devops.local
  labels:
    provider: aws
spec:
  compositeTypeRef:
    apiVersion: platform.devops.local/v1alpha1
    kind: CompositeDBNetworkS3
  mode: Pipeline
  pipeline:
  - step: patch-and-transform
    functionRef:
      name: function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      resources:
      - name: rdsinstance
        base:
          apiVersion: rds.aws.upbound.io/v1beta1
          kind: Instance
          spec:
            forProvider:
              region: us-east-1
              allocatedStorage: 20
              dbName: postgres
              engine: postgres
              engineVersion: "14.5"
              instanceClass: db.t4g.micro
              masterUsername: postgres
              masterPasswordSecretRef:
                name: db-password
                namespace: crossplane-system
                key: password
              skipFinalSnapshot: true
              publiclyAccessible: true
            writeConnectionSecretToRef:
              name: db-connection
              namespace: crossplane-system
        patches:
        - fromFieldPath: spec.parameters.storageGB
          toFieldPath: spec.forProvider.allocatedStorage
        - fromFieldPath: spec.parameters.region
          toFieldPath: spec.forProvider.region
        - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
          toFieldPath: spec.writeConnectionSecretToRef.namespace
        - fromFieldPath: metadata.labels[crossplane.io/claim-name]
          toFieldPath: spec.writeConnectionSecretToRef.name
          transforms:
          - type: string
            string:
              fmt: "%s-db-conn"
      - name: s3bucket
        base:
          apiVersion: s3.aws.upbound.io/v1beta1
          kind: Bucket
          spec:
            forProvider:
              region: us-east-1
            writeConnectionSecretToRef:
              name: s3-connection
              namespace: crossplane-system
        patches:
        - fromFieldPath: spec.parameters.bucketName
          toFieldPath: metadata.name
        - fromFieldPath: spec.parameters.region
          toFieldPath: spec.forProvider.region
        - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
          toFieldPath: spec.writeConnectionSecretToRef.namespace
        - fromFieldPath: metadata.labels[crossplane.io/claim-name]
          toFieldPath: spec.writeConnectionSecretToRef.name
          transforms:
          - type: string
            string:
              fmt: "%s-s3-conn"
  writeConnectionSecretsToNamespace: crossplane-system
