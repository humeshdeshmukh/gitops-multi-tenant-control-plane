apiVersion: v1
kind: Namespace
metadata:
  name: control-plane-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane-portal-sa
  namespace: control-plane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: control-plane-portal-role
rules:
- apiGroups: [""]
  resources: ["namespaces", "pods", "services", "secrets", "configmaps", "events"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list"]
- apiGroups: ["argoproj.io"]
  resources: ["applications", "applicationsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["platform.devops.local"]
  resources: ["postgresqlinstances", "compositepostgresqlinstances"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["rds.aws.upbound.io"]
  resources: ["instances"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["kyverno.io"]
  resources: ["clusterpolicies", "policies"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: control-plane-portal-role-binding
subjects:
- kind: ServiceAccount
  name: control-plane-portal-sa
  namespace: control-plane-system
roleRef:
  kind: ClusterRole
  name: control-plane-portal-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-portal
  namespace: control-plane-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane-portal
  template:
    metadata:
      labels:
        app: control-plane-portal
    spec:
      serviceAccountName: control-plane-portal-sa
      containers:
      - name: control-plane-portal
        image: control-plane-portal:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5006
        env:
        - name: REPO_PATH
          value: /app/platform-repo.git
        - name: TEMPLATES_PATH
          value: /app/app/gitops-templates
        - name: PORT
          value: "5006"
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane-portal
  namespace: control-plane-system
spec:
  type: NodePort
  ports:
  - port: 5006
    targetPort: 5006
    nodePort: 32080
  selector:
    app: control-plane-portal
