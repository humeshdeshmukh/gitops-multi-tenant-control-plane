apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vcluster-tenant-namespace
  namespace: argocd
spec:
  project: default
  source:
    chart: vcluster
    repoURL: https://charts.loft.sh
    targetRevision: 0.19.5
    helm:
      values: |
        syncer:
          extraArgs:
          - --sync-all-node-status
          - --sync-node-changes
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
        vcluster:
          image: loftsh/vcluster:0.19.5
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
        storage:
          persistence: false
  destination:
    server: https://kubernetes.default.svc
    namespace: tenant-namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
