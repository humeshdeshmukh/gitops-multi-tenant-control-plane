apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-platform-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://control-plane-portal.control-plane-system.svc.cluster.local:5006/git/platform-repo.git
    targetRevision: HEAD
    path: argocd/applicationsets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
